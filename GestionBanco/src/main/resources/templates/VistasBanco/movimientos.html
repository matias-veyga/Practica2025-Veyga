<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Movimientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 30px;
        }
        h1 {
            color: #007bff;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        .ingreso {
            color: green;
            font-weight: bold;
        }
        .egreso {
            color: red;
            font-weight: bold;
        }
        .info-card {
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .info-card-header {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
        .alert {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="text-center">Historial de Movimientos</h1>
    
    <div th:if="${mensaje}" class="alert alert-success" role="alert">
        <span th:text="${mensaje}"></span>
    </div>
    
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}"></span>
    </div>
    
    <div th:if="${cuenta}" class="card info-card">
        <div class="card-header info-card-header">
            Información de la Cuenta
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <p><strong>Número de Cuenta:</strong> <span th:text="${cuenta.numerocuenta}"></span></p>
                    <p><strong>Titular:</strong> <span th:text="${cuenta.cliente.nombre}"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Saldo Actual:</strong> <span th:text="${cuenta.saldoactual}"></span></p>
                    <p><strong>Estado:</strong> <span th:text="${cuenta.estado}"></span></p>
                </div>
            </div>
        </div>
    </div>
    
    <div th:unless="${cuenta}">
        <div class="card mb-4">
            <div class="card-header">
                Seleccionar Cuenta
            </div>
            <div class="card-body">
                <form th:action="@{/movimientos}" method="get">
                    <div class="mb-3">
                        <label for="numeroCuenta" class="form-label">Número de Cuenta:</label>
                        <select name="numeroCuenta" class="form-select" required>
                            <option value="">Seleccionar cuenta</option>
                            <option th:each="c : ${cuentas}" 
                                    th:value="${c.numerocuenta}" 
                                    th:text="${c.numerocuenta + ' - ' + c.cliente.nombre}"></option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Ver Movimientos</button>
                </form>
            </div>
        </div>
    </div>
    
    <div th:if="${cuenta}">
        <div th:if="${movimientos != null and !movimientos.isEmpty()}">
            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Tipo</th>
                        <th>Importe</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="mov : ${movimientos}">
                        <td th:text="${mov.id}"></td>
                        <td th:text="${mov.fecha}"></td>
                        <td th:class="${mov.tipo == 'INGRESO' ? 'ingreso' : 'egreso'}" th:text="${mov.tipo}"></td>
                        <td th:class="${mov.tipo == 'INGRESO' ? 'ingreso' : 'egreso'}" th:text="${mov.importe}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div th:if="${movimientos == null or movimientos.isEmpty()}" class="alert alert-info">
            No hay movimientos registrados para esta cuenta.
        </div>
    </div>
    
    <div class="text-center mt-4">
        <a th:if="${cuenta}" th:href="@{/formulariomovimiento(numeroCuenta=${cuenta.numerocuenta})}" class="btn btn-primary">Realizar Nueva Operación</a>
        <a href="/detallescuenta" class="btn btn-secondary">Volver a Cuentas</a>
    </div>
</div>
</body>
</html>
