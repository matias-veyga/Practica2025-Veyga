<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizar Operación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
        }
        .container {
            margin-top: 50px;
            max-width: 600px;
        }
        h2 {
            color: #007bff;
            text-align: center;
            margin-bottom: 30px;
        }
        .btn-primary {
            width: 100%;
            margin-bottom: 10px;
        }
        .card {
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Operaciones Bancarias</h2>
    
    <div th:if="${cuenta}" class="card mb-4">
        <div class="card-header">
            Información de la Cuenta
        </div>
        <div class="card-body">
            <p><strong>Número de Cuenta:</strong> <span th:text="${cuenta.numerocuenta}"></span></p>
            <p><strong>Titular:</strong> <span th:text="${cuenta.cliente.nombre}"></span></p>
            <p><strong>Saldo Actual:</strong> <span th:text="${cuenta.saldoactual}"></span></p>
            <p><strong>Estado:</strong> <span th:text="${cuenta.estado}"></span></p>
            <p><strong>Límite de Extracción:</strong> <span th:text="${cuenta.limiteextracion}"></span></p>
        </div>
    </div>
    
    <div th:unless="${cuenta}" class="card mb-4">
        <div class="card-header">
            Seleccionar Cuenta
        </div>
        <div class="card-body">
            <form th:action="@{/formulariomovimiento}" method="get">
                <div class="mb-3">
                    <label for="numeroCuenta" class="form-label">Número de Cuenta:</label>
                    <select name="numeroCuenta" class="form-select" required>
                        <option value="">Seleccionar cuenta</option>
                        <option th:each="c : ${cuentas}" 
                                th:value="${c.numerocuenta}" 
                                th:text="${c.numerocuenta + ' - ' + c.cliente.nombre}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Seleccionar</button>
            </form>
        </div>
    </div>
    
    <div th:if="${cuenta}" class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Realizar Depósito</div>
                <div class="card-body">
                    <form th:action="@{/realizarDeposito}" method="post">
                        <input type="hidden" name="numeroCuenta" th:value="${cuenta.numerocuenta}">
                        <div class="mb-3">
                            <label for="importe" class="form-label">Importe:</label>
                            <input type="number" step="0.01" min="0.01" class="form-control" name="importe" required>
                        </div>
                        <button type="submit" class="btn btn-success">Depositar</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Realizar Extracción</div>
                <div class="card-body">
                    <form th:action="@{/realizarExtraccion}" method="post">
                        <input type="hidden" name="numeroCuenta" th:value="${cuenta.numerocuenta}">
                        <div class="mb-3">
                            <label for="importe" class="form-label">Importe:</label>
                            <input type="number" step="0.01" min="0.01" class="form-control" name="importe" required>
                        </div>
                        <button type="submit" class="btn btn-warning">Extraer</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <div class="mt-4 text-center">
        <a th:if="${cuenta}" th:href="@{/movimientos(numeroCuenta=${cuenta.numerocuenta})}" class="btn btn-info">Ver Historial de Movimientos</a>
        <a th:href="@{/detallescuenta}" class="btn btn-secondary">Volver a Cuentas</a>
    </div>
</div>
</body>
</html>
