<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Movimientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   
</head>
<body class="bg-light">
    <div class="container py-4">
        <h3 class="text-center mb-4">Historial de Movimientos</h3>

        <div th:if="${cuenta != null}" class="mb-4">
            <p><strong>Número de Cuenta:</strong> <span th:text="${cuenta.numerocuenta}"></span></p>
            <p><strong>Cliente:</strong> <span th:text="${cuenta.cliente.nombre}"></span></p>
            <p><strong>Saldo Actual:</strong> <span th:text="${cuenta.saldoactual}"></span></p>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered">
                <thead class="table-light">
                    <tr>
                        <th>Fecha</th>
                        <th>Tipo</th>
                        <th>Importe</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="movimiento : ${movimientos}">
                        <td th:text="${#temporals.format(movimiento.fecha, 'dd/MM/yyyy')}"></td>
                        <td th:text="${movimiento.importe >= 0 ? 'Depósito' : 'Extracción'}"></td>
                        <td th:classappend="${movimiento.importe >= 0 ? 'positive' : 'negative'}"
                            th:text="${#numbers.formatDecimal(movimiento.importe, 1, 2)}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(movimientos)}">
                        <td colspan="3" class="text-center">No hay movimientos registrados</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="text-center mt-3">
            <a th:href="@{/detallescuenta}" class="btn btn-outline-primary">Volver</a>
        </div>
    </div>
</body>
</html>
